name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          docker build -t schwung-organelle-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build schwung-organelle-builder ./scripts/build.sh
      - name: Update release.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF#refs/tags/}/organelle-module.tar.gz"
          cat > release.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "${URL}"
          }
          EOF
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/organelle-module.tar.gz
      - name: Commit release.json back to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git add release.json
          git diff --staged --quiet || git commit -m "release: update release.json for ${GITHUB_REF#refs/tags/}"
          git push
